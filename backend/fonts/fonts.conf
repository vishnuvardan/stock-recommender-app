<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Vercel Serverless task directory -->
  <dir>/var/task/fonts</dir>
  
  <!-- Fallback for local development -->
  <dir>./fonts</dir>

  <!-- Writable cache directory needed for serverless environments -->
  <cachedir>/tmp/fonts-cache</cachedir>

  <config></config>
</fontconfig>
